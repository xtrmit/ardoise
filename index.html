<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181c" media="(prefers-color-scheme: dark)">
<meta name="description" content="L'Ardoise — noter à la voix ou au clavier ses tâches, rendez-vous et rappels datés.">
<title>L'Ardoise</title>
<link rel="manifest" id="manifest" href="manifest.webmanifest">
<script>
  /* Environnement : prod = github.io/ardoise/, test = github.io/ardoise-test/, sinon local (PC). */
  (function(){
    var h=location.hostname, p=location.pathname;
    var env = /github\.io$/.test(h) ? (/-test\//.test(p) ? 'test' : 'prod') : 'local';
    window.ARDOISE_ENV = env;
    if (env !== 'prod') {
      document.getElementById('manifest').href = 'manifest-test.webmanifest';
      document.title = "L'Ardoise " + env.toUpperCase();
    }
    /* thème choisi (avant l'affichage, pour éviter un flash de couleur) */
    try {
      var r = JSON.parse(localStorage.getItem('ardoise:' + env + ':reglages'));
      if (r && (r.theme === 'light' || r.theme === 'dark')) document.documentElement.setAttribute('data-theme', r.theme);
    } catch (e) {}
  })();
</script>
<script src="version.js"></script>
<script src="js/store.js"></script>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">
      <img id="brandLogo" src="icons/icon-192.png" alt="">
      <div class="titles">
        <h1>L'Ardoise <span class="tag" id="envTag" hidden></span></h1>
        <div class="date"><span id="todayLabel"></span><span class="off-pill" id="offPill">Hors ligne</span></div>
      </div>
    </div>
    <button class="purge" id="purgeBtn" title="Purger les cartes barrées"></button>
    <button class="icon-btn" id="setBtn" aria-label="Réglages"></button>
  </header>

  <main id="list"></main>

  <div class="rec" id="rec" aria-live="polite">
    <div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="time" id="recTime">0:00</div>
    <div class="tip" id="recTip"></div>
  </div>

  <div class="bar">
    <form class="field" id="textForm" autocomplete="off">
      <input id="textInput" placeholder="Écrire une note…" enterkeyhint="send" aria-label="Écrire une note">
    </form>
    <button class="mic" id="mic" aria-label="Maintenir pour dicter"></button>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast"><div class="m" id="toastMsg"></div><button id="toastUndo">Annuler</button></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
